# ============================================================
# Microservicio
# ============================================================
server.port=8082
spring.application.name=mascotas-ordenes

# Detalle de errores en la respuesta JSON (consumido por el GlobalExceptionHandler).
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# Datasource: Oracle Cloud Autonomous Database (ADB) vía Wallet mTLS.
# Credenciales y ruta del Wallet inyectadas por variables de entorno:
#   ORACLE_ADB_USER     -> usuario/schema
#   ORACLE_ADB_PASSWORD -> contraseña
#   ORACLE_ADB_SERVICE  -> alias del tnsnames.ora
#   ORACLE_WALLET_PATH  -> ruta absoluta al Wallet descomprimido
# ============================================================
# URL JDBC Thin con alias TNS; tns_admin se pasa abajo como propiedad del driver
# (Windows usa "\" y el parser de la URL no lo acepta inline).
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_ADB_SERVICE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_ADB_USER}
spring.datasource.password=${ORACLE_ADB_PASSWORD}

# Propiedades del driver Oracle propagadas por HikariCP.
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_PATH}
spring.datasource.hikari.data-source-properties.oracle.net.ssl_server_dn_match=true

# Pool HikariCP.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# DDL gestionado manualmente con schema.sql; Hibernate no toca el esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.duoc.mascotasordenes=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
