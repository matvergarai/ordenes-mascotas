# ============================================================
# CONFIGURACIÓN GENERAL DEL MICROSERVICIO
# ============================================================
server.port=8082
# Puerto TCP en el que el servidor web embebido (Tomcat) escucha las peticiones HTTP
spring.application.name=mascotas-ordenes
# Nombre lógico del microservicio en Spring Boot (útil para logs y descubrimiento de servicios)

# ============================================================
# MANEJO DE ERRORES (se combina con el GlobalExceptionHandler)
# ============================================================
server.error.include-message=always
# Incluye el mensaje de la excepción en la respuesta JSON de error
server.error.include-binding-errors=always
# Incluye el detalle de los errores de validación (@Valid) en la respuesta

# ============================================================
# DATASOURCE: ORACLE CLOUD AUTONOMOUS DATABASE (ADB) vía Wallet mTLS
# Las credenciales se leen desde variables de entorno.
# Definir antes de iniciar:
#   ORACLE_ADB_USER     -> usuario/schema 
#   ORACLE_ADB_PASSWORD -> contraseña del usuario
#   ORACLE_ADB_SERVICE  -> alias del tnsnames.ora del Wallet 
#   ORACLE_WALLET_PATH  -> ruta absoluta al Wallet descomprimido
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_ADB_SERVICE}
# URL JDBC Thin: solo el alias del tnsnames.ora (sin TNS_ADMIN aquí, porque Windows usa "\" y el parser JDBC lo rechaza)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Driver JDBC Thin de Oracle (ojdbc11 incluido en el pom.xml)
spring.datasource.username=${ORACLE_ADB_USER}
# Usuario de la BD leído desde variable de entorno
spring.datasource.password=${ORACLE_ADB_PASSWORD}
# Password leído desde variable de entorno

# --- Propiedades propias del driver Oracle pasadas por HikariCP ---
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_PATH}
# Le indica al driver dónde está el Wallet descomprimido (tnsnames.ora, cwallet.sso, etc.)
spring.datasource.hikari.data-source-properties.oracle.net.ssl_server_dn_match=true
# Exige que el DN del certificado del servidor coincida (mTLS contra Oracle Cloud)

# --- Pool de conexiones HikariCP (por defecto en Spring Boot) ---
spring.datasource.hikari.maximum-pool-size=5
# Máximo 5 conexiones concurrentes hacia ADB
spring.datasource.hikari.minimum-idle=1
# Mínimo 1 conexión ociosa en el pool
spring.datasource.hikari.connection-timeout=30000
# 30s máximo de espera para obtener una conexión del pool

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Dialecto de Hibernate adecuado para Oracle 19c/21c/23ai
spring.jpa.hibernate.ddl-auto=none
# No modifica el esquema automáticamente: el DDL se aplica con schema.sql (SQL Developer)
spring.jpa.show-sql=true
# Muestra en logs las sentencias SQL ejecutadas por Hibernate
spring.jpa.properties.hibernate.format_sql=true
# Formatea el SQL para que sea legible en la consola
spring.sql.init.mode=never
# No ejecuta scripts automáticamente: el schema.sql y data.sql se aplican manualmente en SQL Developer

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
# Nivel por defecto para todos los paquetes
logging.level.com.duoc.mascotasordenes=DEBUG
# Nivel detallado para el código propio del microservicio
logging.level.org.springframework.web=INFO
# Nivel informativo para el framework web
logging.level.org.springframework.security=INFO
# Nivel informativo para Spring Security (autenticación/autorización)
logging.level.org.hibernate.SQL=DEBUG
# Muestra todas las consultas SQL que ejecuta Hibernate
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# Patrón de log con timestamp, nivel, hilo, clase y mensaje
